# .github/workflows/horario.yml
# Cada madrugada descarga el horario de Renfe Cercanías y regenera data/barbera.json.
# También se puede lanzar a mano desde la pestaña Actions (botón "Run workflow").
name: Actualizar horario Barbera

on:
  schedule:
    # Horas en UTC. Varios intentos porque GitHub a veces retrasa o se salta ejecuciones.
    - cron: '23 1 * * *'
    - cron: '47 3 * * *'
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-horario
  cancel-in-progress: false

jobs:
  horario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar GTFS de Renfe Cercanias
        run: |
          curl -sSfL --retry 3 --retry-delay 20 -o fomento.zip \
            https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip
          mkdir -p gtfs
          unzip -o -q fomento.zip -d gtfs
          ls -la gtfs

      - name: Generar data/barbera.json
        run: node scripts/horario.js gtfs data/barbera.json

      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/barbera.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Horario actualizado $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
